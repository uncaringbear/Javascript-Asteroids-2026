<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asteroids — Neon Wireframe</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #04060c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, "Courier New", Menlo, Consolas, monospace;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  main { display: block; }
  #game {
    display: block;
    background: #04060c;
    cursor: crosshair;
    outline: none;
  }
</style>
</head>
<body>
<main>
  <canvas id="game" width="960" height="600" role="img"
          aria-label="Asteroids — neon wireframe space shooter"></canvas>
</main>

<script>
(() => {
"use strict";

/* ================================================================
 *  CONSTANTS & TUNING TABLE
 * ================================================================ */
const STATE = Object.freeze({
  MENU: "MENU",
  PLAYING: "PLAYING",
  GAME_OVER: "GAME_OVER"
});

const CONFIG = Object.freeze({
  startLives: 3,
  ship: {
    radius: 12,          // collision radius (px)
    rotateSpeed: 3.8,    // rad / s
    thrust: 1400,        // px / s^2
    drag: 0.4,           // exponential velocity decay coefficient
    maxSpeed: 700,       // px / s hard cap
    fireCooldown: 0.16,  // s between lasers
    laserSpeed: 20,     // px / s relative to ship
    respawnDelay: 2.2,   // s before re-deployment
    invulnerable: 2.6    // s of post-respawn immunity
  },
  laser: {
    radius: 2.6,
    life: 1.15           // s
  },
  asteroid: {
    3: { radius: 56, score: 20,  speedMin: 28,  speedMax: 85,  spin: 0.55 },
    2: { radius: 31, score: 50,  speedMin: 70,  speedMax: 145, spin: 1.25 },
    1: { radius: 16, score: 100, speedMin: 125, speedMax: 230, spin: 2.20 }
  },
  split: {
    inherit: 1.14,       // child keeps ~114% of parent velocity
    lateralMin: 55,      // perpendicular impulse (px / s)
    lateralMax: 125
  }
});

/* ================================================================
 *  VECTOR2D — minimal 2-D vector algebra utility
 * ================================================================ */
class Vector2D {
  constructor(x = 0, y = 0) {
    this.x = x;
    this.y = y;
  }

  clone() {
    return new Vector2D(this.x, this.y);
  }

  add(v) {
    this.x += v.x;
    this.y += v.y;
    return this;
  }

  sub(v) {
    this.x -= v.x;
    this.y -= v.y;
    return this;
  }

  scale(s) {
    this.x *= s;
    this.y *= s;
    return this;
  }

  magnitude() {
    return Math.hypot(this.x, this.y);
  }

  magnitudeSq() {
    return this.x * this.x + this.y * this.y;
  }

  normalize() {
    const m = this.magnitude();
    if (m > 1e-9) {
      this.x /= m;
      this.y /= m;
    }
    return this;
  }

  limit(max) {
    const mSq = this.magnitudeSq();
    if (mSq > max * max) {
      this.scale(max / Math.sqrt(mSq));
    }
    return this;
  }

  angle() {
    return Math.atan2(this.y, this.x);
  }

  distanceTo(v) {
    return Math.hypot(this.x - v.x, this.y - v.y);
  }

  static fromAngle(a, len = 1) {
    return new Vector2D(Math.cos(a) * len, Math.sin(a) * len);
  }

  static random(len = 1) {
    return Vector2D.fromAngle(Math.random() * Math.PI * 2, len);
  }
}

/* ================================================================
 *  GEOMETRY — narrow-phase circle vs polygon collision
 * ================================================================ */
function pointInPolygon(px, py, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i].x, yi = pts[i].y;
    const xj = pts[j].x, yj = pts[j].y;
    if ((yi > py) !== (yj > py) &&
        px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) {
      inside = !inside;
    }
  }
  return inside;
}

function pointSegmentDistSq(px, py, ax, ay, bx, by) {
  const dx = bx - ax;
  const dy = by - ay;
  const lenSq = dx * dx + dy * dy;
  let t = lenSq === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx;
  const cy = ay + t * dy;
  const ex = px - cx;
  const ey = py - cy;
  return ex * ex + ey * ey;
}

function circlePolygonHit(cx, cy, r, pts) {
  if (pointInPolygon(cx, cy, pts)) return true;
  const rSq = r * r;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    if (pointSegmentDistSq(cx, cy, pts[j].x, pts[j].y, pts[i].x, pts[i].y) < rSq) {
      return true;
    }
  }
  return false;
}

/*
 * Swept narrow phase for fast projectiles: does the segment
 * (ax,ay)→(bx,by) — i.e. the laser's travel this frame — strike the polygon,
 * counting the laser's radius as clearance? Catches tunnelling that a single
 * centre-to-centre point test misses (esp. across concave asteroid corners).
 */
function segPolygonHit(ax, ay, bx, by, r, pts) {
  const rSq = r * r;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const px = pts[j].x, py = pts[j].y;
    const qx = pts[i].x, qy = pts[i].y;
    /* (a) Segment crosses the polygon edge. */
    const d1x = qx - px, d1y = qy - py;
    const d2x = bx - ax, d2y = by - ay;
    const denom = d1x * d2y - d1y * d2x;
    const t = denom !== 0 &&
      ((ax - px) * d2y - (ay - py) * d2x) / denom;
    const u = denom !== 0 &&
      ((ax - px) * d1y - (ay - py) * d1x) / denom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) return true;
    /* (b) Closest point of the segment to the edge lies within the laser radius. */
    if (pointSegmentDistSq(px, py, ax, ay, bx, by) < rSq) return true;
    if (pointSegmentDistSq(qx, qy, ax, ay, bx, by) < rSq) return true;
  }
  return false;
}

/* ================================================================
 *  ENTITY — base class: position, velocity, integrate, wrap
 * ================================================================ */
class Entity {
  constructor(position, engine) {
    this.position = position;
    this.velocity = new Vector2D();
    this.radius = 10;
    this.alive = true;
    this.engine = engine;
  }

  /* Advance position along velocity for dt seconds (state mutation only). */
  integrate(dt) {
    /* Note: advance position WITHOUT mutating velocity.
       This used to be `this.position.add(this.velocity.scale(dt))`, but
       Vector2D.scale() is destructive, so that permanently multiplied the
       entity's velocity by dt every frame (ship stuck near 0, SPD readout 0). */
    this.position.x += this.velocity.x * dt;
    this.position.y += this.velocity.y * dt;
    this.wrap(this.engine.width, this.engine.height);
  }

  /*
   * Seamless screen wrap keyed to the entity's radial boundary:
   * an entity re-enters the opposite edge exactly when its outer rim
   * fully leaves the current one — no visual snapping.
   */
  wrap(w, h) {
    const r = this.radius;
    const p = this.position;
    if (p.x + r < 0) p.x += w;
    else if (p.x - r > w) p.x -= w;
    if (p.y + r < 0) p.y += h;
    else if (p.y - r > h) p.y -= h;
  }
}

/* ================================================================
 *  SHIP — inertia / friction flight model
 * ================================================================ */
class Ship extends Entity {
  constructor(position, engine) {
    super(position, engine);
    this.radius = CONFIG.ship.radius;
    this.angle = -Math.PI / 2;   // nose up
    this.thrusting = false;
    this.fireTimer = 0;
    this.invulnTimer = 0;
    this.respawnTimer = 0;
    this.dead = false;
    this.visible = true;
  }

  fire() {
    if (this.dead || !this.visible || this.fireTimer > 0) return;
    this.fireTimer = CONFIG.ship.fireCooldown;
    const dir = Vector2D.fromAngle(this.angle);
    const muzzle = this.position.clone().add(dir.scale(this.radius + 6));
    const vel = this.velocity.clone().add(dir.scale(CONFIG.ship.laserSpeed));
    this.engine.lasers.push(new Laser(muzzle, vel, this.engine));
  }

  respawn() {
    const { width: w, height: h } = this.engine;
    let pos = new Vector2D(w / 2, h / 2);
    for (let i = 0; i < 32; i++) {
      const cand = new Vector2D(Math.random() * w, Math.random() * h);
      let safe = true;
      for (const a of this.engine.asteroids) {
        if (cand.distanceTo(a.position) < a.radius + 150) { safe = false; break; }
      }
      if (safe) { pos = cand; break; }
    }
    this.position = pos;
    this.velocity = new Vector2D();
    this.angle = -Math.PI / 2;
    this.dead = false;
    this.visible = true;
    this.invulnTimer = CONFIG.ship.invulnerable;
    this.engine.particles.burst(pos, 16, [160, 230, 255], 18, 110, 0.3, 0.8);
  }

  update(dt) {
    if (this.dead) {
      if (this.respawnTimer > 0) {
        this.respawnTimer -= dt;
        if (this.respawnTimer <= 0) this.respawn();
      }
      return;
    }

    const k = this.engine.input;
    if (k.left)  this.angle -= CONFIG.ship.rotateSpeed * dt;
    if (k.right) this.angle += CONFIG.ship.rotateSpeed * dt;

    this.thrusting = !!k.thrust;
    if (this.thrusting) {
      this.velocity.add(Vector2D.fromAngle(this.angle).scale(CONFIG.ship.thrust * dt));
    }

    /* Frame-rate independent friction: v(t+dt) = v(t) * e^(-drag*dt) */
    this.velocity.scale(Math.exp(-CONFIG.ship.drag * dt));
    this.velocity.limit(CONFIG.ship.maxSpeed);

    if (this.fireTimer > 0) this.fireTimer -= dt;
    if (this.invulnTimer > 0) this.invulnTimer -= dt;

    this.integrate(dt);
  }

  render(ctx) {
    if (this.dead || !this.visible) return;
    /* Blink while invulnerable. */
    if (this.invulnTimer > 0 && Math.floor(this.engine.time * 14) % 2 === 0) return;

    ctx.save();
    ctx.translate(this.position.x, this.position.y);
    ctx.rotate(this.angle);
    ctx.strokeStyle = "#e8f7ff";
    ctx.lineWidth = 1.8;
    ctx.shadowColor = "rgba(120, 216, 255, 0.85)";
    ctx.shadowBlur = 12;

    if (this.thrusting && Math.random() < 0.82) {
      ctx.beginPath();
      ctx.moveTo(-9, 4.6);
      ctx.lineTo(-16 - Math.random() * 8, 0);
      ctx.lineTo(-9, -4.6);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(-10, 9);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-10, -9);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
}

/* ================================================================
 *  ASTEROID — procedural jagged polygon + fission splitting
 * ================================================================ */
class Asteroid extends Entity {
  constructor(position, size, engine, speedMul = 1) {
    super(position, engine);
    this.size = size; // 3 = large, 2 = medium, 1 = small
    const spec = CONFIG.asteroid[size];
    this.radius = spec.radius;
    const speed = (spec.speedMin + Math.random() * (spec.speedMax - spec.speedMin)) * speedMul;
    this.velocity = Vector2D.random(speed);
    this.angle = Math.random() * Math.PI * 2;
    this.spin = (Math.random() < 0.5 ? -1 : 1) *
      spec.spin * (0.6 + Math.random() * 0.8);
    this.shape = Asteroid.generateShape(this.radius, size);
  }

  /*
   * Unique silhouette per instance: a ring of vertices at the ideal
   * angle step, with randomized angular jitter and radial offsets
   * (72% – 117% of nominal radius) producing a jagged outline.
   */
  static generateShape(radius, size) {
    const vertices = 10 + (3 - size) * 2 + Math.floor(Math.random() * 5);
    const pts = new Array(vertices);
    const slice = (Math.PI * 2) / vertices;
    for (let i = 0; i < vertices; i++) {
      const a = i * slice + (Math.random() - 0.5) * slice * 0.7;
      const r = radius * (0.72 + Math.random() * 0.45);
      pts[i] = new Vector2D(Math.cos(a) * r, Math.sin(a) * r);
    }
    return pts;
  }

  /* World-space polygon (position + rotation applied) for narrow-phase tests. */
  worldPoints() {
    const cos = Math.cos(this.angle);
    const sin = Math.sin(this.angle);
    const pts = this.shape;
    const out = new Array(pts.length);
    for (let i = 0; i < pts.length; i++) {
      out[i] = new Vector2D(
        this.position.x + pts[i].x * cos - pts[i].y * sin,
        this.position.y + pts[i].x * sin + pts[i].y * cos
      );
    }
    return out;
  }

  update(dt) {
    this.angle += this.spin * dt;
    this.integrate(dt);
  }

  render(ctx) {
    ctx.save();
    ctx.translate(this.position.x, this.position.y);
    ctx.rotate(this.angle);
    ctx.beginPath();
    const pts = this.shape;
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    /* Cheap glow: wide faint under-stroke + crisp top stroke. */
    ctx.strokeStyle = "rgba(126, 222, 255, 0.10)";
    ctx.lineWidth = 4.5;
    ctx.stroke();
    ctx.strokeStyle = "rgba(154, 228, 255, 0.95)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}

/* ================================================================
 *  LASER — player projectile with lifetime
 * ================================================================ */
class Laser extends Entity {
  constructor(position, velocity, engine) {
    super(position, engine);
    this.velocity = velocity;
    this.radius = CONFIG.laser.radius;
    this.life = CONFIG.laser.life;
    this.prevPos = position.clone();
  }

  update(dt) {
    this.life -= dt;
    if (this.life <= 0) this.alive = false;
    this.prevPos = this.position.clone();
    this.integrate(dt);
  }

  render(ctx) {
    const v = this.velocity.clone().normalize();
    const tailX = this.position.x - v.x * 8;
    const tailY = this.position.y - v.y * 8;
    ctx.save();
    ctx.strokeStyle = "#fff6cf";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.shadowColor = "rgba(255, 212, 94, 0.9)";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(this.position.x, this.position.y);
    ctx.stroke();
    ctx.restore();
  }
}

/* ================================================================
 *  PARTICLE SYSTEM — pooled streak particles with decay + fade
 * ================================================================ */
class ParticleSystem {
  constructor() {
    this.particles = [];
  }

  clear() {
    this.particles.length = 0;
  }

  /*
   * Spawn a radial burst: random velocities, randomized lifespans,
   * per-particle RGB jitter around a base color, alpha tied to life.
   */
  burst(pos, rgb, count, speedMin, speedMax, lifeMin, lifeMax) {
    for (let i = 0; i < count; i++) {
      const life = lifeMin + Math.random() * (lifeMax - lifeMin);
      const jitter = (base) =>
        Math.max(0, Math.min(255, base + (Math.random() * 90 - 45)));
      this.particles.push({
        position: new Vector2D(
          pos.x + (Math.random() - 0.5) * 8,
          pos.y + (Math.random() - 0.5) * 8
        ),
        velocity: Vector2D.random(speedMin + Math.random() * (speedMax - speedMin)),
        life: life,
        maxLife: life,
        r: jitter(rgb[0]),
        g: jitter(rgb[1]),
        b: jitter(rgb[2])
      });
    }
  }

  update(dt) {
    const drag = Math.exp(-1.7 * dt);
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        this.particles[i] = this.particles[this.particles.length - 1];
        this.particles.pop();
        continue;
      }
      p.position.add(p.velocity.scale(dt));
      p.velocity.scale(drag);
    }
  }

  render(ctx) {
    if (this.particles.length === 0) return;
    ctx.lineWidth = 1.4;
    ctx.lineCap = "round";
    for (const p of this.particles) {
      const a = Math.max(0, p.life / p.maxLife);
      const tailX = p.velocity.x * 0.035;
      const tailY = p.velocity.y * 0.035;
      ctx.strokeStyle =
        "rgba(" + (p.r | 0) + "," + (p.g | 0) + "," + (p.b | 0) + "," +
        (a * 0.9).toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(p.position.x, p.position.y);
      ctx.lineTo(p.position.x - tailX, p.position.y - tailY);
      ctx.stroke();
    }
  }
}

/* ================================================================
 *  ENGINE — game loop, state machine, world, HUD, rendering
 * ================================================================ */
class Engine {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.state = null;
    this.time = 0;

    this.input = { thrust: false, left: false, right: false, fire: false };

    this.particles = new ParticleSystem();
    this.asteroids = [];
    this.lasers = [];
    this.ship = null;
    this.stars = [];

    this.score = 0;
    this.highScore = 0;
    this.newRecord = false;
    this.lives = CONFIG.startLives;
    this.wave = 0;
    this.banner = "";
    this.bannerTimer = 0;
    this.interWaveTimer = 0;

    this.lastTime = 0;

    this.loadHighScore();
    this.onResize();
    this.bindInput();
    this.setState(STATE.MENU);
  }

  /* ---------------- lifecycle ---------------- */

  start() {
    this.lastTime = performance.now();
    const loop = (now) => {
      requestAnimationFrame(loop);
      let dt = (now - this.lastTime) / 1000;
      this.lastTime = now;
      if (dt > 0.05) dt = 0.05;   // clamp after tab-switch / hitches
      if (dt < 0) dt = 0;
      this.lastDt = dt;
      this.time += dt;
      this.update(dt);            // state mutation
      this.render();              // drawing
    };
    requestAnimationFrame(loop);
  }

  /* ---------------- state machine ---------------- */

  setState(next) {
    this.state = next;

    if (next === STATE.PLAYING) {
      this.score = 0;
      this.lives = CONFIG.startLives;
      this.wave = 0;
      this.asteroids = [];
      this.lasers = [];
      this.particles.clear();
      this.banner = "";
      this.bannerTimer = 0;
      this.interWaveTimer = 1.1;  // short beat before wave 1 spawns
      this.ship = new Ship(
        new Vector2D(this.width / 2, this.height / 2),
        this
      );
    } else if (next === STATE.MENU) {
      this.seedAmbient();
    } else if (next === STATE.GAME_OVER) {
      this.newRecord = this.score > this.highScore;
      if (this.newRecord) {
        this.highScore = this.score;
        try {
          window.localStorage.setItem("neon-asteroids-highscore", String(this.highScore));
        } catch (err) {
          /* storage unavailable — high score stays in-memory */
        }
      }
    }
  }

  startGame() {
    this.setState(STATE.PLAYING);
  }

  /* ---------------- input ---------------- */

  bindInput() {
    const map = {
      KeyW: "thrust", ArrowUp: "thrust",
      KeyA: "left",   ArrowLeft: "left",
      KeyD: "right",  ArrowRight: "right",
      Space: "fire"
    };

    window.addEventListener("keydown", (e) => {
      const isEnter = e.code === "Enter" || e.code === "NumpadEnter";

      /* Menu / game-over entry points. */
      if (!e.repeat &&
          (isEnter || e.code === "Space") &&
          (this.state === STATE.MENU || this.state === STATE.GAME_OVER)) {
        e.preventDefault();
        this.startGame();
        return;
      }
      if (!e.repeat && e.code === "KeyR" && this.state === STATE.GAME_OVER) {
        this.startGame();
        return;
      }

      const action = map[e.code];
      if (action) {
        this.input[action] = true;
        e.preventDefault();
      }
    });

    window.addEventListener("keyup", (e) => {
      const action = map[e.code];
      if (action) this.input[action] = false;
    });

    window.addEventListener("blur", () => {
      for (const k in this.input) this.input[k] = false;
    });
  }

  /* ---------------- layout / backdrop ---------------- */

  onResize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.width = window.innerWidth;
    this.height = window.innerHeight;
    this.canvas.width = Math.floor(this.width * dpr);
    this.canvas.height = Math.floor(this.height * dpr);
    this.canvas.style.width = this.width + "px";
    this.canvas.style.height = this.height + "px";
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    this.generateStars();

    const g = this.ctx.createRadialGradient(
      this.width / 2, this.height / 2, Math.min(this.width, this.height) * 0.35,
      this.width / 2, this.height / 2, Math.max(this.width, this.height) * 0.72
    );
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,0.5)");
    this.vignette = g;
  }

  generateStars() {
    const count = Math.max(60, Math.min(220,
      Math.floor((this.width * this.height) / 9000)));
    this.stars = [];
    for (let i = 0; i < count; i++) {
      this.stars.push({
        x: Math.random() * this.width,
        y: Math.random() * this.height,
        s: Math.random() < 0.88 ? 1 : 2,
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 1.6
      });
    }
  }

  seedAmbient() {
    this.asteroids = [];
    this.lasers = [];
    this.ship = null;
    for (let i = 0; i < 5; i++) {
      const p = new Vector2D(Math.random() * this.width, Math.random() * this.height);
      this.asteroids.push(new Asteroid(p, 3, this, 0.7));
    }
  }

  loadHighScore() {
    this.highScore = 0;
    try {
      const v = Number(window.localStorage.getItem("neon-asteroids-highscore"));
      if (Number.isFinite(v) && v > 0) this.highScore = v;
    } catch (err) {
      /* storage unavailable — in-memory high score only */
    }
  }

  /* ---------------- world rules ---------------- */

  nextWave() {
    this.wave += 1;
    const count = Math.min(2 + this.wave, 9);
    const speedMul = 1 + (this.wave - 1) * 0.07;
    for (let i = 0; i < count; i++) {
      let p;
      for (let tries = 0; tries < 24; tries++) {
        p = new Vector2D(Math.random() * this.width, Math.random() * this.height);
        if (!this.ship ||
            p.distanceTo(this.ship.position) > 240) break;
      }
      this.asteroids.push(new Asteroid(p, 3, this, speedMul));
    }
    this.banner = "WAVE " + String(this.wave).padStart(2, "0");
    this.bannerTimer = 2.2;
  }

  /*
   * Destructive fission: the hit asteroid is marked dead and, if its
   * tier allows, exactly two children spawn at the impact point with
   * the parent velocity (slightly boosted) plus equal and opposite
   * lateral impulses. Small asteroids terminate.
   */
  destroyAsteroid(ast) {
    ast.alive = false;
    this.score += CONFIG.asteroid[ast.size].score;
    this.particles.burst(
      ast.position,
      [140, 214, 255],
      16 + ast.size * 7,
      40 + ast.size * 20,
      130 + ast.size * 55,
      0.4,
      1.15
    );

    if (ast.size > 1) {
      const perp = new Vector2D(-ast.velocity.y, ast.velocity.x).normalize();
      for (const side of [-1, 1]) {
        const child = new Asteroid(ast.position.clone(), ast.size - 1, this);
        const vel = ast.velocity.clone().scale(CONFIG.split.inherit);
        vel.add(perp.scale(side * (CONFIG.split.lateralMin +
          Math.random() * (CONFIG.split.lateralMax - CONFIG.split.lateralMin))));
        const maxV = CONFIG.asteroid[child.size].speedMax * 1.7;
        const m = vel.magnitude();
        if (m > maxV) vel.scale(maxV / m);
        child.velocity = vel;
        this.asteroids.push(child);
      }
    }
  }

  destroyShip() {
    const ship = this.ship;
    ship.dead = true;
    ship.visible = false;
    this.particles.burst(
      ship.position,
      [255, 178, 74],
      54,
      30,
      340,
      0.5,
      1.5
    );
    this.lives -= 1;
    if (this.lives <= 0) {
      this.setState(STATE.GAME_OVER);
    } else {
      ship.respawnTimer = CONFIG.ship.respawnDelay;
    }
  }

  /*
   * Collision matrix:
   *  1. broad phase — circle-vs-circle distance test
   *  2. narrow phase — circle-vs-polygon (edge distance / ray cast)
   * Applied to every active laser × asteroid pair and ship × asteroid.
   */
  resolveCollisions() {
    /* lasers vs asteroids */
    for (const laser of this.lasers) {
      if (!laser.alive) continue;
      for (const ast of this.asteroids) {
        if (!ast.alive) continue;
        /* Swept test over the laser's travel this frame: catches tunneling
           and concave-corner passes that a centre-to-centre point test misses. */
        if (segPolygonHit(laser.prevPos.x, laser.prevPos.y,
                          laser.position.x, laser.position.y,
                          laser.radius, ast.worldPoints())) {
          laser.alive = false;
          this.particles.burst(laser.position, [255, 240, 200],
                               8, 40, 170, 0.15, 0.4);
          this.destroyAsteroid(ast);
          break;
        }
      }
    }

    /* ship vs asteroids */
    const ship = this.ship;
    if (ship && ship.visible && !ship.dead && ship.invulnTimer <= 0) {
      for (const ast of this.asteroids) {
        if (!ast.alive) continue;
        const reach = ship.radius + ast.radius;
        if (ship.position.distanceTo(ast.position) > reach) continue;
        if (circlePolygonHit(ship.position.x, ship.position.y,
                             ship.radius * 0.85, ast.worldPoints())) {
          this.destroyShip();
          break;
        }
      }
    }
  }

  /* ---------------- update (state mutation only) ---------------- */

  update(dt) {
    this.particles.update(dt);

    switch (this.state) {
      case STATE.MENU:
      case STATE.GAME_OVER:
        /* Keep debris drifting behind the overlay for atmosphere. */
        for (const ast of this.asteroids) ast.update(dt);
        break;

      case STATE.PLAYING:
        if (this.bannerTimer > 0) this.bannerTimer -= dt;
        if (this.input.fire) this.ship.fire();

        this.ship.update(dt);
        for (const laser of this.lasers) laser.update(dt);
        for (const ast of this.asteroids) ast.update(dt);

        this.resolveCollisions();

        this.lasers = this.lasers.filter((l) => l.alive);
        this.asteroids = this.asteroids.filter((a) => a.alive);

        /* Wave progression: clear the field → short beat → next wave. */
        if (this.asteroids.length === 0) {
          this.interWaveTimer -= dt;
          if (this.interWaveTimer <= 0) this.nextWave();
        } else {
          this.interWaveTimer = 1.4;
        }
        break;
    }
  }

  /* ---------------- render (drawing only) ---------------- */

  render() {
    const ctx = this.ctx;
    const { width: w, height: h } = this;

    ctx.fillStyle = "#04060c";
    ctx.fillRect(0, 0, w, h);
    this.renderStars(ctx);

    for (const ast of this.asteroids) ast.render(ctx);
    for (const laser of this.lasers) laser.render(ctx);
    this.particles.render(ctx);
    if (this.ship && this.state === STATE.PLAYING) this.ship.render(ctx);

    ctx.fillStyle = this.vignette;
    ctx.fillRect(0, 0, w, h);

    if (this.state === STATE.PLAYING) {
      this.renderHUD(ctx);
      if (this.bannerTimer > 0) this.renderBanner(ctx);
    } else if (this.state === STATE.MENU) {
      this.renderMenu(ctx);
    } else if (this.state === STATE.GAME_OVER) {
      this.renderGameOver(ctx);
    }
  }

  renderStars(ctx) {
    for (const st of this.stars) {
      const a = 0.18 + 0.5 * (0.5 + 0.5 * Math.sin(this.time * st.speed + st.phase));
      ctx.fillStyle = "rgba(186, 224, 255," + a.toFixed(3) + ")";
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }
  }

  drawShipIcon(ctx, x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = "rgba(160, 220, 255, 0.9)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.lineTo(7, 7);
    ctx.lineTo(0, 4);
    ctx.lineTo(-7, 7);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  renderHUD(ctx) {
    const { width: w, height: h } = this;
    ctx.save();
    ctx.font = "700 15px ui-monospace, 'Courier New', monospace";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(178, 226, 255, 0.92)";

    ctx.textAlign = "left";
    ctx.fillText("SCORE  " + String(this.score).padStart(6, "0"), 22, 18);

    /* Temporary debug readout: speed (px/s), live config, and key state. */
    const s = this.ship;
    const spd = Math.round(s.velocity.magnitude());
    ctx.fillText(
      "SPD " + String(spd).padStart(4, "0") +
      "  THRUST " + CONFIG.ship.thrust +
      "  CAP " + CONFIG.ship.maxSpeed +
      "  KEY " + (this.input.thrust ? 1 : 0),
      22, 40
    );
    ctx.fillText(
      "DEAD " + (s.dead ? 1 : 0) +
      "  VIS " + (s.visible ? 1 : 0) +
      "  STHR " + (s.thrusting ? 1 : 0) +
      "  RT " + (s.respawnTimer || 0).toFixed(2) +
      "  INV " + (s.invulnTimer || 0).toFixed(2) +
      "  WAVE " + this.wave +
      "  LIVES " + this.lives +
      "  |  DT " + ((this.lastDt || 0) * 1000).toFixed(3) + "ms" +
      "  TIME " + this.time.toFixed(2) +
      "  X " + Math.round(s.position.x) + "  Y " + Math.round(s.position.y),
      22, 62
    );

    ctx.textAlign = "right";
    ctx.fillText("HI  " + String(this.highScore).padStart(6, "0"), w - 22, 18);

    ctx.textAlign = "center";
    ctx.fillText("WAVE  " + String(this.wave).padStart(2, "0"), w / 2, 18);

    for (let i = 0; i < this.lives; i++) {
      this.drawShipIcon(ctx, 30 + i * 28, h - 26);
    }
    ctx.restore();
  }

  renderBanner(ctx) {
    const { width: w, height: h } = this;
    const alpha = Math.max(0, Math.min(1, this.bannerTimer / 0.7));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = "700 30px ui-monospace, 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#d6f2ff";
    ctx.shadowColor = "rgba(110, 216, 255, 0.8)";
    ctx.shadowBlur = 16;
    ctx.fillText(this.banner, w / 2, h * 0.3);
    ctx.restore();
  }

  renderMenu(ctx) {
    const { width: w, height: h } = this;
    ctx.save();
    ctx.fillStyle = "rgba(3, 5, 10, 0.58)";
    ctx.fillRect(0, 0, w, h);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "700 52px ui-monospace, 'Courier New', monospace";
    ctx.fillStyle = "#e6f7ff";
    ctx.shadowColor = "rgba(110, 216, 255, 0.9)";
    ctx.shadowBlur = 22;
    ctx.fillText("A S T E R O I D S", w / 2, h * 0.26);
    ctx.shadowBlur = 0;

    ctx.font = "400 13px ui-monospace, 'Courier New', monospace";
    ctx.fillStyle = "rgba(148, 205, 240, 0.85)";
    ctx.fillText("NEON WIREFRAME  ·  ZERO DEPENDENCIES  ·  100% OFFLINE", w / 2, h * 0.26 + 42);

    if (Math.floor(this.time * 2.2) % 2 === 0) {
      ctx.font = "700 17px ui-monospace, 'Courier New', monospace";
      ctx.fillStyle = "#ffffff";
      ctx.fillText("PRESS  ENTER  TO  LAUNCH", w / 2, h * 0.52);
    }

    ctx.font = "400 14px ui-monospace, 'Courier New', monospace";
    ctx.fillStyle = "rgba(148, 205, 240, 0.9)";
    ctx.fillText("W / ↑  —  THRUST        A / D  ·  ← / →  —  ROTATE", w / 2, h * 0.615);
    ctx.fillText("SPACE  —  FIRE           ENTER  —  START / RESTART", w / 2, h * 0.615 + 22);

    ctx.font = "700 14px ui-monospace, 'Courier New', monospace";
    ctx.fillStyle = "rgba(178, 226, 255, 0.92)";
    ctx.fillText("HI-SCORE  " + String(this.highScore).padStart(6, "0"), w / 2, h * 0.72);

    ctx.restore();
  }

  renderGameOver(ctx) {
    const { width: w, height: h } = this;
    ctx.save();
    ctx.fillStyle = "rgba(3, 5, 10, 0.62)";
    ctx.fillRect(0, 0, w, h);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "700 52px ui-monospace, 'Courier New', monospace";
    ctx.fillStyle = "#ffe3e3";
    ctx.shadowColor = "rgba(255, 110, 90, 0.8)";
    ctx.shadowBlur = 20;
    ctx.fillText("G A M E   O V E R", w / 2, h * 0.30);
    ctx.shadowBlur = 0;

    ctx.font = "700 18px ui-monospace, 'Courier New', monospace";
    ctx.fillStyle = "rgba(178, 226, 255, 0.95)";
    ctx.fillText("FINAL SCORE  " + String(this.score).padStart(6, "0"), w / 2, h * 0.44);

    ctx.font = "700 15px ui-monospace, 'Courier New', monospace";
    ctx.fillStyle = "rgba(148, 205, 240, 0.9)";
    const bestLine = "BEST  " + String(this.highScore).padStart(6, "0") +
      (this.newRecord ? "   ★  NEW RECORD" : "");
    ctx.fillText(bestLine, w / 2, h * 0.44 + 30);

    if (Math.floor(this.time * 2.2) % 2 === 0) {
      ctx.font = "700 17px ui-monospace, 'Courier New', monospace";
      ctx.fillStyle = "#ffffff";
      ctx.fillText("PRESS  ENTER  TO  RESTART", w / 2, h * 0.62);
    }

    ctx.restore();
  }
}

/* ================================================================
 *  BOOTSTRAP
 * ================================================================ */
const engine = new Engine(document.getElementById("game"));
window.addEventListener("resize", () => engine.onResize());
engine.start();

})();
</script>
